[package]
name = "wmapp-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
bech32 = "0.9"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"
secp256k1 = { version = "0.31", features = ["global-context", "rand", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
