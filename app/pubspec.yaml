name: wingman_app
description: Native Wingman App shell for Drive, WApps, and signing.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  bech32: ^0.2.2
  bip340: ^0.3.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.8.0
  webview_flutter_wkwebview: ^3.14.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2
  webview_flutter_platform_interface: ^2.10.0

flutter:
  uses-material-design: true
